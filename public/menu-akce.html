  --display:'Nayuki',"Playfair Display",Georgia,serif;
  --body:'PoppinsB',"Poppins",-apple-system,"Segoe UI",sans-serif;

  --fit:1;
  --pad:clamp(18px,3.4vh,44px);
}
:root[data-mode="noc"]{
  /* NOC — tmavé pozadí značky, pro večer a šero */
  --bg:#1C1C1C;
  --bg-2:#232220;
  --fg:#E3DED5;
  --fg-soft:#8E8E8E;
  --accent:#BE973C;
  --rule:rgba(227,222,213,.2);
  --leaf:rgba(227,222,213,.06);
  --shade:rgba(227,222,213,.05);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
  transition:background .45s ease,color .45s ease;
}

/* ---------- Deska menu ---------- */
.board{
  position:relative;
  height:100dvh;height:100svh;
  display:grid;
  grid-template-rows:auto 1fr auto;
  gap:clamp(10px,2vh,26px);
  padding:calc(var(--pad) + env(safe-area-inset-top)) calc(var(--pad) + env(safe-area-inset-right))
          calc(var(--pad) + env(safe-area-inset-bottom)) calc(var(--pad) + env(safe-area-inset-left));
  overflow:hidden;
  z-index:1;
}

/* listy — jemná textura značky (maska, aby se obarvila podle režimu) */
.decor{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.leaf{
  position:absolute;pointer-events:none;
  aspect-ratio:348/420;background-color:var(--leaf);
  -webkit-mask-image:var(--leaf-src);mask-image:var(--leaf-src);
  -webkit-mask-size:100% 100%;mask-size:100% 100%;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  transition:background-color .45s ease;
}
.leaf-a{top:-7vh;right:-5vw;width:clamp(170px,25vw,330px);transform:rotate(18deg)}
.leaf-b{bottom:-9vh;left:-6vw;width:clamp(190px,29vw,390px);transform:rotate(-160deg)}

/* ---------- Hlavička ---------- */
header{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.4vh,14px);text-align:center}
.logo{
  width:calc(clamp(118px,20vh,215px) * var(--fit));aspect-ratio:820/326;
  background-color:var(--accent);
  -webkit-mask-image:var(--logo-src);mask-image:var(--logo-src);
  -webkit-mask-size:100% 100%;mask-size:100% 100%;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  transition:background-color .45s ease;
}
.eyebrow{
  font-size:calc(clamp(9px,1.6vh,14px) * var(--fit));
  font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--fg-soft);
}
h1{
  font-family:var(--display);font-weight:400;
  font-size:calc(clamp(30px,7.4vh,70px) * var(--fit));
  line-height:.98;color:var(--accent);text-wrap:balance;
}

/* ---------- Sloupce ---------- */
.cols{
  display:grid;grid-template-columns:.9fr auto 1.1fr;
  align-items:start;
  gap:0 clamp(20px,4vw,60px);
  align-self:center;width:100%;max-width:1200px;margin-inline:auto;
}
.divider{width:1px;align-self:stretch;background:var(--rule)}
.col{display:flex;flex-direction:column;gap:calc(clamp(18px,4.8vh,56px) * var(--fit));min-width:0}
section{min-width:0}
h2{
  font-family:var(--display);font-weight:400;
  font-size:calc(clamp(24px,5.6vh,52px) * var(--fit));
  line-height:1.1;color:var(--accent);
}
/* bracket motiv z brand manuálu: linka + zlatý bod */
.rule{display:flex;align-items:center;margin:calc(clamp(7px,1.3vh,14px) * var(--fit)) 0 calc(clamp(11px,2.2vh,26px) * var(--fit))}
.rule::before{content:"";height:2px;width:calc(clamp(26px,5vh,52px) * var(--fit));background:var(--accent);border-radius:2px}
.rule i{width:calc(clamp(5px,.9vh,8px) * var(--fit));aspect-ratio:1;border-radius:50%;background:var(--accent);margin-left:calc(clamp(4px,.7vh,7px) * var(--fit))}
.rule::after{content:"";flex:1;height:1px;background:var(--rule);margin-left:calc(clamp(4px,.7vh,7px) * var(--fit))}

ul{list-style:none;display:flex;flex-direction:column;gap:calc(clamp(9px,3vh,38px) * var(--fit))}
li{transition:opacity .25s ease}
.row{display:flex;align-items:baseline;width:100%}
.name{
  font-size:calc(clamp(15px,3.4vh,30px) * var(--fit));
  font-weight:500;line-height:1.18;color:var(--fg);text-wrap:balance;
}
.dots{flex:1;min-width:14px;height:0;border-bottom:1px dotted var(--rule);margin:0 .55em;transform:translateY(-.28em)}
.price{
  font-size:calc(clamp(15px,3.4vh,30px) * var(--fit));
  font-weight:600;color:var(--accent);white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.price small{font-size:.62em;font-weight:500;margin-left:.22em;opacity:.75}
.desc{
  font-size:calc(clamp(11px,2.2vh,18px) * var(--fit));
  font-style:italic;color:var(--fg-soft);line-height:1.35;
  margin-top:calc(clamp(2px,.5vh,6px) * var(--fit));max-width:34ch;
}

/* vyprodáno */
li[data-out="1"]{opacity:.45}
li[data-out="1"] .name{text-decoration:line-through;text-decoration-thickness:1px}
li[data-out="1"] .name::after{
  content:"vyprodáno";display:inline-block;text-decoration:none;vertical-align:.14em;
  margin-left:.55em;padding:.2em .7em .16em;
  border:1px solid currentColor;border-radius:999px;color:var(--fg-soft);
  font-size:.4em;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
}

/* ---------- QR: menu do mobilu ---------- */
.qr{display:flex;align-items:center;gap:calc(clamp(7px,1.2vh,14px) * var(--fit))}
/* dlaždice je světlá v obou režimech — invertovaný QR čtečky zvládají hůř */
.qr-tile{
  background:#E3DED5;border:1px solid var(--accent);border-radius:8px;
  padding:calc(clamp(4px,.7vh,8px) * var(--fit));line-height:0;flex:none;
}
/* QR se smí zmenšovat s deskou, ale nikdy pod 72 px — jinak ho mobil nepřečte */
.qr-tile img{width:max(72px, calc(clamp(80px,11vh,104px) * var(--fit)));height:auto;display:block}
.qr-text b{
  display:block;font-family:var(--display);font-weight:400;
  color:var(--accent);font-size:1.5em;line-height:1.15;
}
.qr-text span{display:block;margin-top:.15em}

/* ---------- Patička ---------- */
footer{
  display:flex;justify-content:space-between;align-items:center;gap:clamp(12px,2.5vw,40px);
  padding-top:calc(clamp(7px,1.4vh,16px) * var(--fit));
  border-top:1px solid var(--rule);
  font-size:calc(clamp(9px,1.6vh,14px) * var(--fit));
  color:var(--fg-soft);line-height:1.4;
}
footer b{font-family:var(--display);font-weight:400;color:var(--accent);font-size:1.35em;letter-spacing:.02em}
.wifi{display:flex;align-items:center;gap:.6em;text-align:right}
.wifi span{white-space:nowrap}

/* ---------- Ovládání (jen pro obsluhu) ---------- */
.tools{
  position:fixed;z-index:5;
  top:calc(env(safe-area-inset-top) + 8px);right:calc(env(safe-area-inset-right) + 8px);
  display:flex;gap:6px;opacity:.5;transition:opacity .5s ease;
}
.tools.idle{opacity:.06}
.tools button{
  -webkit-appearance:none;appearance:none;cursor:pointer;
  width:38px;height:38px;border-radius:50%;
  border:1px solid var(--rule);background:var(--shade);color:var(--fg-soft);
  font-family:var(--body);font-size:15px;line-height:1;
  display:grid;place-items:center;
}
.tools button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* toast */
.toast{
  position:fixed;z-index:6;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);
  transform:translate(-50%,14px);opacity:0;pointer-events:none;
  background:var(--fg);color:var(--bg);
  font-size:13px;font-weight:500;letter-spacing:.02em;
  padding:9px 16px;border-radius:999px;transition:opacity .3s ease,transform .3s ease;
}
.toast.on{opacity:.92;transform:translate(-50%,0)}

/* ---------- Na výšku: sloupce pod sebe ---------- */
@media (orientation:portrait){
  .cols{grid-template-columns:1fr;gap:clamp(16px,3.4vh,40px) 0;align-self:start;max-width:760px}
  .divider{width:auto;height:1px;align-self:auto}
  .desc{max-width:none}
}
@media (max-width:520px){
  footer{flex-direction:column;align-items:flex-start;gap:.5rem}
  .wifi{text-align:left}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<div class="decor" aria-hidden="true">
  <div class="leaf leaf-a"></div>
  <div class="leaf leaf-b"></div>
</div>

<div class="board" id="board">
  <header>
    <div class="logo" id="logo" role="img" aria-label="Čajbar Pangea"></div>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="title"></h1>
  </header>

  <div class="cols" id="cols"></div>

  <footer>
    <div class="qr">

<div class="tools" id="tools">
  <button id="btn-mode" type="button" title="Den / noc" aria-label="Přepnout den / noc">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5 8.5 8.5 0 1 0 20.5 14.3Z"/></svg>
  </button>
  <button id="btn-full" type="button" title="Celá obrazovka" aria-label="Celá obrazovka">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   NASTAVENÍ MENU — tady se mění všechno, co je vidět
   Ceny piš jako číslo (69), měnu řeší „mena“ níž.
   Popisek (desc) je nepovinný — když ho nechceš, řádek smaž.
   ============================================================ */
const MENU = {
  eyebrow: "Venkovní akce",
  title:   "Speciální nabídka",
  mena:    "Kč",

  /* sloupec: 1 = vlevo, 2 = vpravo (na výšku se sloupce poskládají pod sebe) */
  sekce: [
    {
      nadpis: "Nápoje", sloupec: 1,
      polozky: [
        { name: "Teplý čaj dle nabídky", price: 49 },
        { name: "Ledový Tuareg",       price: 69 },
        { name: "Ledový ibišek",       price: 69 },
        { name: "Masala na ledu",      price: 69 },
        { name: "Masala Libre",        price: 129 },
        { name: "Virgin Masala Libre", price: 99 },
        { name: "Gin tonic / pink",    price: 119 }
      ]
    },
    {
      nadpis: "Jídlo", sloupec: 2,
      polozky: [
        { name: "Masová bagetka s trhaným masem", price: 79 },
        { name: "Vege bagetka se sýrem labneh",   price: 79 },
        { name: "Full plate", price: 139,
          desc: "Od každého trošku — salát, maso, humus, prostě všechno!" }
      ]
    },
    {
      nadpis: "Dýmky", sloupec: 2,
      polozky: [
        { name: "Dýmka", price: 350 }
      ]
    }
  ],

  /* QR míří na https://pangea-eosin.vercel.app/menu-akce.html
     Pozor: obrázek QR je předgenerovaný. Když se změní adresa menu,
     musí se vygenerovat nový — samotná změna textu tady nestačí. */
  qr: { popisek: "Menu do mobilu", podtitul: "Naskenuj a odnes si ho s sebou" },

  poznamka: "*Alergeny a složení na vyžádání u obsluhy",
  wifi: { sit: "Pangea", heslo: "heslojeheslo" }
};
/* ====================== KONEC NASTAVENÍ ====================== */


/* ---------- vykreslení ---------- */
const $ = (id) => document.getElementById(id);

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* česká typografie — jednopísmenné předložky a spojky se nesmí lámat na konec řádku */
function cz(s){ return esc(s).replace(/(^|[\s(])([aikosuvzAIKOSUVZ])\s+/g, '$1$2\u00A0'); }

function render(){
  $('eyebrow').textContent = MENU.eyebrow || '';
  $('title').textContent   = MENU.title || '';
  $('note').textContent    = MENU.poznamka || '';

  $('qr-text').innerHTML = MENU.qr
    ? '<b>' + cz(MENU.qr.popisek) + '</b><span>' + cz(MENU.qr.podtitul) + '</span>'
    : '';

  $('wifi').innerHTML = MENU.wifi
    ? '<b>WIFI</b><span>' + esc(MENU.wifi.sit) + '<br>heslo: ' + esc(MENU.wifi.heslo) + '</span>'
    : '';

  const cols = { 1: [], 2: [] };
  MENU.sekce.forEach((s, si) => {
    const items = s.polozky.map((p, pi) => {
      const key = si + '-' + pi;
      return '<li data-key="' + key + '">' +
        '<div class="row">' +
          '<span class="name">' + cz(p.name) + '</span>' +
          '<span class="dots" aria-hidden="true"></span>' +
          '<span class="price">' + p.price + '<small>' + esc(MENU.mena) + '</small></span>' +
        '</div>' +
        (p.desc ? '<p class="desc">' + cz(p.desc) + '</p>' : '') +
      '</li>';
    }).join('');
    const html = '<section><h2>' + esc(s.nadpis) + '</h2><div class="rule"><i></i></div><ul>' + items + '</ul></section>';
    cols[s.sloupec === 2 ? 2 : 1].push(html);
  });
  $('cols').innerHTML =
    '<div class="col">' + cols[1].join('') + '</div>' +
    '<div class="divider" aria-hidden="true"></div>' +
    '<div class="col">' + cols[2].join('') + '</div>';
  applySoldOut();
}

/* ---------- vyprodáno: podrž prst na položce ---------- */
const STORE = 'pangea-menu-vyprodano';
let soldOut = new Set();
try { soldOut = new Set(JSON.parse(localStorage.getItem(STORE) || '[]')); } catch (e) {}

function saveSoldOut(){
  try { localStorage.setItem(STORE, JSON.stringify([...soldOut])); } catch (e) {}
}
function applySoldOut(){
  document.querySelectorAll('#cols li').forEach(li => {
    if (soldOut.has(li.dataset.key)) li.dataset.out = '1'; else delete li.dataset.out;
  });
}

let pressTimer = null, pressed = null;
function startPress(e){
  const li = e.target.closest('#cols li');
  if (!li) return;
  pressed = li;
  pressTimer = setTimeout(() => {
    pressTimer = null;
    const k = li.dataset.key;
    if (soldOut.has(k)) { soldOut.delete(k); toast('Zpátky v nabídce'); }
    else { soldOut.add(k); toast('Označeno jako vyprodané'); }
    saveSoldOut(); applySoldOut();
    if (navigator.vibrate) navigator.vibrate(12);
  }, 700);
}
function endPress(){ clearTimeout(pressTimer); pressTimer = null; pressed = null; }

document.addEventListener('pointerdown', startPress);
document.addEventListener('pointerup', endPress);
document.addEventListener('pointercancel', endPress);
document.addEventListener('pointermove', e => { if (pressed && e.buttons) endPress(); });
document.addEventListener('contextmenu', e => { if (e.target.closest('#cols')) e.preventDefault(); });

/* dlouhý stisk loga = zrušit všechna „vyprodáno“ */
let logoTimer = null;
$('logo').addEventListener('pointerdown', () => {
  logoTimer = setTimeout(() => {
    soldOut.clear(); saveSoldOut(); applySoldOut(); toast('Vyprodané položky zrušeny');
  }, 1200);
});
['pointerup','pointercancel','pointerleave'].forEach(ev =>
  $('logo').addEventListener(ev, () => clearTimeout(logoTimer)));

/* ---------- den / noc ---------- */
const MODE = 'pangea-menu-rezim';
function setMode(m){
  document.documentElement.dataset.mode = m;
  const tc = document.querySelector('meta[name="theme-color"]');
  if (tc) tc.content = (m === 'noc') ? '#1C1C1C' : '#E3DED5';
  try { localStorage.setItem(MODE, m); } catch (e) {}
}
try { setMode(localStorage.getItem(MODE) === 'noc' ? 'noc' : 'den'); } catch (e) { setMode('den'); }
$('btn-mode').addEventListener('click', () => {
  setMode(document.documentElement.dataset.mode === 'noc' ? 'den' : 'noc');
  fit();
});

/* ---------- celá obrazovka ---------- */
const el = document.documentElement;
const canFull = !!(el.requestFullscreen || el.webkitRequestFullscreen);
if (!canFull || window.navigator.standalone) $('btn-full').style.display = 'none';
$('btn-full').addEventListener('click', () => {
  const d = document;
  if (d.fullscreenElement || d.webkitFullscreenElement) {
    (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  } else {
    (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  }
});

/* ---------- ať iPad neusne ---------- */
let lock = null;
async function keepAwake(){
  if (!('wakeLock' in navigator)) return;
  try { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); }
  catch (e) {}
}
keepAwake();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !lock) keepAwake(); });
document.addEventListener('pointerdown', () => { if (!lock) keepAwake(); }, { passive: true });

/* ---------- ovládání zmizí, když se nesahá ---------- */
let idleTimer;
function wake(){
  $('tools').classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => $('tools').classList.add('idle'), 6000);
}
['pointerdown','pointermove'].forEach(ev => document.addEventListener(ev, wake, { passive: true }));
wake();

/* ---------- toast ---------- */
let toastTimer;
function toast(text){
  const t = $('toast');
  t.textContent = text;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1800);
}

/* ---------- vždy na jednu obrazovku, bez rolování ---------- */
function fit(){
  const root = document.documentElement, board = $('board');
  let s = 1;
  root.style.setProperty('--fit', s);
  for (let i = 0; i < 24 && board.scrollHeight > board.clientHeight + 1 && s > 0.55; i++) {
    s = Math.round((s - 0.03) * 1000) / 1000;
    root.style.setProperty('--fit', s);
  }
}
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
window.addEventListener('load', fit);
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', () => setTimeout(fit, 350));
fit();
</script>
