name: Vercel Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  deploy:
    # Na pull requestu nedeployujeme — tam běží jen kontroly níž.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel (via Git integration)
        run: echo "Vercel auto-deploys on push to main via Git integration at https://pangea-eosin.vercel.app"

  guard:
    name: Kontroly (čas, typy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalace závislostí
        run: npm ci
      # Typová kontrola: dřív se rozbitý typ chytil až při nasazení na produkci.
      - name: Typy
        run: npm run typecheck
      # Regresní síť na logiku kolem peněz a napojení na pokladnu.
      - name: Testy
        run: npm test
      # Že se to opravdu sestaví. Dummy proměnné stačí, build nevolá databázi.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://u:p@localhost/db
          NEXTAUTH_SECRET: ci-build-secret
      # Obchodní den se počítá v Praze — UTC odvození vrací mezi půlnocí
      # a druhou ranní včerejšek a rozbíjí uzávěrky po noční směně.
      - name: Datum obchodního dne
        run: node scripts/check-time.mjs
      # Česká desetinná čárka v poli type="number" znamená uloženou nulu —
      # špatný odpis ze skladu a špatnou marži.
      - name: Desetinná pole
        run: node scripts/check-decimal-inputs.mjs
      # Dvě šířkové třídy v jednom className: ta z konstanty přebije tu
      # zamýšlenou a pole se roztáhne přes vedlejší sloupec.
      - name: Soupeřící šířky
        run: node scripts/check-width-clash.mjs
      # Šedý text pod 55 % a písmo pod 11 px se na baru ve dne nepřečte.
      # Kontrast se měří v prohlížeči; tohle hlídá jen to, co je vidět ze zdroje.
      - name: Čitelnost textu
        run: node scripts/check-contrast-classes.mjs
      # Tichý catch u načítání = obrazovka zaseknutá na skeletonu napořád.
      # Po výpadku sítě to vypadá jako rozbitá aplikace, i když jde o vteřinu.
      - name: Poctivé načítání
        run: node scripts/check-silent-load.mjs
      # Aplikace se prodává kavárnám, restauracím i barům. Ukázka „Sencha
      # Gyokuro" v poli říká zákazníkovi s bistrem, že to není pro něj.
      - name: Univerzální texty
        run: node scripts/check-generic-copy.mjs
      # Oranžová i žlutá pro „čeká" znamenají, že barva přestala nést význam.
      - name: Paleta
        run: node scripts/check-palette.mjs
      # Paleta měla u stavů jen podklad a text — plný odstín si každé místo
      # odhadlo z Tailwindu. Naměřeno 12 červených a 10 jantarových.
      - name: Stavové barvy
        run: node scripts/check-status-colors.mjs
      # Ručně psaná okna se převádějí postupně; tohle hlídá, aby jich
      # nepřibývalo a aby nové vznikalo komponentou <Modal>.
      - name: Okna
        run: node scripts/check-modals.mjs
      # Escape a klik vedle okna zavíraly bez ptaní — u rozepsané směrnice
      # to byla hodina práce pryč jedním omylem.
      - name: Rozepsané v oknech
        run: node scripts/check-modal-guard.mjs
      # `transition-all` animuje i rozvržení; na tabletu u kasy to poskakuje.
      - name: Přechody
        run: node scripts/check-transitions.mjs
      # Tlačítko bez `type` uvnitř <form> formulář odesílá — „Zrušit"
      # by uložilo místo zahození.
      - name: Formuláře
        run: node scripts/check-forms.mjs
      # Po číslovce má čeština tři tvary: 1 položka, 2–4 položky, 5+ položek.
      - name: Skloňování
        run: node scripts/check-czech.mjs
      # Testy si Node pouští přímo, takže alias `@/` v nich spadne.
      - name: Importy v testech
        run: node scripts/check-test-imports.mjs
      # Aplikace je vícem­ěnová; „Kč" nalepené na číslo ukáže rakouské
      # kavárně koruny. Ráčna: nesmí přibývat.
      - name: Měna
        run: node scripts/check-money.mjs
      # `fetch` nepadá na HTTP 500 — načtení, které nekontroluje stav,
      # uloží chybové tělo jako data a obrazovka pak tvrdí, že nic není.
      - name: Odmítnutí serveru
        run: node scripts/check-fetch-ok.mjs
      # Kalendář je slib o čase: bez DTSTAMP soubor Outlook odmítne a bez
      # popisu pásma ukáže klient směnu o hodiny jinde.
      - name: Kalendář
        run: node scripts/check-ics.mjs
      # `emails.send()` nevyhazuje výjimku — bez čtení `error` se odmítnutá
      # objednávka tváří jako odeslaná a vedoucí čeká na zboží.
      - name: Odesílání e-mailů
        run: node scripts/check-email.mjs
      # Třída, která si nastaví barvu textu, ji musí mít i pro tmavý režim —
      # jinak zůstane černá na černém (naměřeno 1,03 : 1 u záložek).
      - name: Tmavý režim
        run: node scripts/check-dark-classes.mjs
      # `<label>` bez `htmlFor` vypadá jako popisek, ale odečítač obrazovky
      # ho k poli nepřipojí. Ráčna: nesmí přibývat.
      - name: Popisky polí
        run: node scripts/check-labels.mjs
      # Bez vlastní stránky ukáže Next.js anglické „404 This page could not
      # be found." — a dojde na ni zákazník se starým sdíleným odkazem.
      - name: Slepé uličky
        run: node scripts/check-dead-ends.mjs
      # Mutace, jejíž výsledek nikdo nečte, selže potichu: obrazovka se
      # jen načte znovu a člověk nepozná, proč se nic nestalo.
      - name: Tiché změny
        run: node scripts/check-silent-mutation.mjs
      # Koncept leží v úložišti prohlížeče. Heslo, token ani číslo karty
      # tam nepatří — uchovat je není laskavost, ale bezpečnostní chyba.
      - name: Tajemství v konceptu
        run: node scripts/check-draft-safety.mjs
      # Statický import těžkého pohledu stáhne celou aplikaci, i když
      # uživatel otevře jednu záložku. Naměřeno 421 kB místo 160 kB.
      - name: Líné pohledy
        run: node scripts/check-lazy-views.mjs
      # Na monitoru nadpis vlevo a akce vpravo; na 390 px se řádek zalomí
      # a `ml-auto` nechá akci viset samotnou v pravé půlce prázdného řádku.
      - name: Zarovnání akcí na telefonu
        run: node scripts/check-mobile-align.mjs
      # Na telefonu vyjíždějí okna zdola a dosedají na spodní hranu. Dělají
      # to dvě třídy v globals.css; vlastní překryv bez nich visí uprostřed.
      - name: Okna vyjíždějí zdola
        run: node scripts/check-sheet.mjs
      # Offline stránka se předcachuje. Když se změní její text, ale ne název
      # cache, tablet za barem ukazuje starou verzi napořád.
      - name: Otisk offline stránky
        run: node scripts/check-offline-cache.mjs
      # Pořadí dnů v mřížce určuje nastavení podniku, ne pondělí natvrdo.
      # Rozvrh ho ignoroval, zatímco kalendáře vedle něj ho ctily.
      - name: Začátek týdne
        run: node scripts/check-week-start.mjs
